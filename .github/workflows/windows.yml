name: Version Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm test
      - run: npm run pack-windows
      - uses: actions/upload-artifact@v4
        with:
          name: Soundcrossing-Windows-x64
          path: livraison/Soundcrossing-Windows-x64.zip
      - name: Publier le ZIP dans « Soundcrossing pour Windows »
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --yes --cleanup-tag || true
          gh release create windows livraison/Soundcrossing-Windows-x64.zip \
            --title "Soundcrossing pour Windows" \
            --notes "Dernière version, mise à jour automatiquement. Téléchargez Soundcrossing-Windows-x64.zip, faites clic droit → Extraire tout, puis double-cliquez sur « Lancer Soundcrossing.bat ». Rien à installer, Internet inutile."
