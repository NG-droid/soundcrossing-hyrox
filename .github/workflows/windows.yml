name: Version Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet : numéro de version (dernier « Merge pull request #… »)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compilateur Windows pour Soundcrossing.exe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - run: npm ci
      - run: npm test
      - name: Tests du serveur (port et données temporaires)
        run: python -m unittest tests/test_server_data.py
      - run: npm run pack-windows
      - uses: actions/upload-artifact@v4
        with:
          name: Soundcrossing-Windows-x64
          path: livraison/Soundcrossing-Windows-x64.zip
      - name: Publier le ZIP dans « Soundcrossing pour Windows »
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --yes --cleanup-tag || true
          gh release create windows livraison/Soundcrossing-Windows-x64.zip livraison/VERSION.txt \
            --title "Soundcrossing pour Windows" \
            --notes "Dernière version, mise à jour automatiquement. Téléchargez Soundcrossing-Windows-x64.zip, faites clic droit → Extraire tout, puis double-cliquez sur « Soundcrossing.exe » (aucune fenêtre noire : Soundcrossing reste en icône près de l’horloge, clic droit → Quitter pour l’arrêter). Rien à installer. Les versions suivantes s’installent toutes seules au lancement quand Internet est disponible."
